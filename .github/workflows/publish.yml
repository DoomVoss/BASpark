name: Build and Release Installer

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Web tests
        shell: pwsh
        run: node --test tests/Web/fx-adapter.test.mjs tests/Web/vendor-contract.test.mjs

      - name: Run .NET tests
        shell: pwsh
        run: dotnet test BASpark.sln -c Release --verbosity normal

      - name: Build Packaged Files
        shell: pwsh
        run: |
          $RAW_VER = "${{ github.ref_name }}".TrimStart("v")
          
          dotnet publish src/BASpark.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:Version=$RAW_VER `
            -o src/publish_full

      - name: Compile Inno Setup
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ github.ref_name }} setup.iss

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BASpark_Installer_*.exe
          name: "BASpark Pre-release ${{ github.ref_name }}"
          generate_release_notes: true
          body: |
            ## BASpark Pre-release (Preview) ${{ github.ref_name }}
            
            ---
            
            - **Environment / 运行环境**：Windows 10/11 (x64) | .NET 8.0 Runtime
            - **License / 开源协议**：MIT License
            - **Feedback / 问题反馈**：[Issue](https://github.com/DoomVoss/BASpark/issues/new/choose)
            
            This release includes the following changes:
            本次更新包含以下改动：
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
